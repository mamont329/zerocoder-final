{% extends 'finance/base.html' %}

{% block title %}Вход — FinControl{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">Вход</h1>

        {% if form.errors %}
          <div class="alert alert-danger">Неверное имя пользователя или пароль.</div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Имя пользователя</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}"
                   class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Пароль</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}"
                   class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
          Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
