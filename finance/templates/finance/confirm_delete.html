{% extends 'finance/base.html' %}

{% block title %}{{ title }} — FinControl{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">{{ title }}</h1>
        <p>Удалить безвозвратно: <strong>{{ object }}</strong>?</p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{{ view.success_url }}" class="btn btn-outline-secondary">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
